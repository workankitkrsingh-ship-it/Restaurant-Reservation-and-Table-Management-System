<div class="min-h-[84vh] flex items-center justify-center px-4 py-12 bg-slate-100/70">
  <div class="w-full max-w-lg bg-white rounded-2xl border border-slate-200 p-8 shadow-sm border-t-4 border-t-emerald-800">
    <div class="mb-6">
      <span class="text-[11px] font-bold uppercase tracking-widest text-emerald-700">Membership Registration</span>
      <h1 class="text-2xl font-bold text-slate-900 font-serif mt-0.5">Join The Verdant Table</h1>
      <p class="text-xs text-slate-500 mt-1">
        Register as a dining guest or enter the Maitre D' key for administrative access
      </p>
    </div>

    @if (errorMessage()) {
      <div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Ankit Singh"
          class="w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-emerald-700 focus:bg-white focus:outline-none"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="farid@example.com"
            class="w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-emerald-700 focus:bg-white focus:outline-none"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Number</label>
          <input
            type="tel"
            name="phone"
            [(ngModel)]="phone"
            placeholder="+91 98765 43210"
            class="w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-emerald-700 focus:bg-white focus:outline-none"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password *</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="At least 6 characters"
          class="w-full rounded-lg border border-slate-300 bg-slate-50/50 px-3.5 py-2.5 text-sm text-slate-900 focus:border-emerald-700 focus:bg-white focus:outline-none"
        />
      </div>

      <div class="pt-3 border-t border-slate-100">
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Maitre D' Admin Secret Key <span class="text-slate-400 font-normal">(Optional)</span>
        </label>
        <input
          type="password"
          name="adminSecretKey"
          [(ngModel)]="adminSecretKey"
          placeholder="Leave empty for standard guest account"
          class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3.5 py-2 text-xs text-slate-900 focus:border-emerald-700 focus:outline-none"
        />
        <span class="text-[11px] text-slate-400 mt-1 block">
          Admin key for testing: <code class="text-emerald-800 font-semibold">admin_restaurant_2026</code>
        </span>
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-2.5 px-4 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-white font-semibold text-sm shadow-xs transition-colors cursor-pointer disabled:opacity-50"
      >
        {{ loading() ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-emerald-800 hover:underline font-semibold">
        Sign In
      </a>
    </p>
  </div>
</div>
