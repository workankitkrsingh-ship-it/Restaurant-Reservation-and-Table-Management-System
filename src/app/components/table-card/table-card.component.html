<div
  class="bg-white rounded-xl border border-slate-200 p-5 shadow-xs hover:shadow-md transition-all flex flex-col justify-between h-full"
  [ngClass]="getTopAccentClass(table.status)"
>
  <div>
    <!-- Top Meta & Badge -->
    <div class="flex items-center justify-between gap-2 mb-3">
      <span class="px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-semibold tracking-wide uppercase">
        {{ table.location }}
      </span>
      <span
        class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border"
        [ngClass]="getStatusBadgeClass(table.status)"
      >
        &bull; {{ table.status }}
      </span>
    </div>

    <!-- Table Title & Capacity -->
    <div class="flex items-baseline justify-between mb-4 pb-3 border-b border-slate-100">
      <h3 class="text-xl font-bold text-slate-900 font-serif">
        Suite / Table {{ table.tableNumber }}
      </h3>
      <span class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
        {{ table.capacity }} Seats
      </span>
    </div>

    <!-- Features List -->
    @if (table.features && table.features.length > 0) {
      <div class="flex flex-wrap gap-1.5 mb-4">
        @for (feat of table.features; track feat) {
          <span class="px-2 py-0.5 rounded-md bg-slate-50 border border-slate-200 text-slate-600 text-[11px]">
            {{ feat }}
          </span>
        }
      </div>
    }
  </div>

  <!-- Action Footer -->
  <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
    @if (showReserveButton && table.status === 'Available') {
      <button
        type="button"
        (click)="onBookClick()"
        class="w-full py-2 px-3 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-semibold tracking-wide transition-colors cursor-pointer"
      >
        Book Table {{ table.tableNumber }} &rarr;
      </button>
    }

    @if (isAdmin) {
      <div class="flex items-center justify-between gap-2 pt-1">
        <select
          [value]="table.status"
          (change)="onStatusChange($any($event.target).value)"
          class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:border-emerald-700"
        >
          <option value="Available">Available</option>
          <option value="Reserved">Reserved</option>
          <option value="Occupied">Occupied</option>
          <option value="Maintenance">Maintenance</option>
        </select>

        <button
          type="button"
          (click)="onDeleteClick()"
          class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold border border-rose-200 transition-colors cursor-pointer"
        >
          Remove
        </button>
      </div>
    }
  </div>
</div>
